{% extends "template.html" %}

{% block title %}
Parking
{% endblock %}

{% block content %}

<div class="parking-bg" style="position: relative; width: 100%; height: 500px;">
    {% for i in range(parking_count) %}
    <div class="plaza-parking"
        style="position: absolute; top: {{vertical_positions[i]}}px; left: {{horizontal_positions[i]}}px; width: {{parking_width}}px; height: 96px; background: lightgray;">
    </div>
    {% endfor %}
</div>

{% endblock %}
